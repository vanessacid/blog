{%- assign meses = "enero,febrero,marzo,abril,mayo,junio,julio,agosto,septiembre,octubre,noviembre,diciembre" | split: "," -%}
{%- assign m = include.fecha | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.fecha | date: '%Y-%m-%d' }}">{{ include.fecha | date: "%-d" }} de {{ meses[m] }} de {{ include.fecha | date: "%Y" }}</time>
